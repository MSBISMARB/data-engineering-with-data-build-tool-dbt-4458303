name: Run AI Workflows from Notion

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allow manual triggering
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual execution)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      max_workflows:
        description: 'Maximum number of workflows to run'
        required: false
        default: '10'

env:
  NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
  NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  AI_MODEL: gpt-3.5-turbo
  WORKFLOW_STATUS_FILTER: Active
  LOG_LEVEL: INFO

jobs:
  run-ai-workflows:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Validate configuration
      run: |
        if [ -z "$NOTION_API_KEY" ] || [ -z "$OPENAI_API_KEY" ]; then
          echo "Error: Required API keys are not set in secrets"
          exit 1
        fi
        echo "✓ API keys configured"
    
    - name: Run AI Workflows
      env:
        DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        MAX_WORKFLOWS_PER_RUN: ${{ github.event.inputs.max_workflows || '10' }}
      run: |
        cd ai_workflow
        python examples/run_workflows.py
    
    - name: Upload execution logs
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: workflow-execution-logs
        path: |
          *.log
        retention-days: 7
